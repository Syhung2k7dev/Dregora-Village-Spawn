name: Build Forge 1.12.2 mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build with ForgeGradle 3
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '5.6.4'
          arguments: build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DregoraVillageSpawn
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

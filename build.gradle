buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        mavenCentral()
    }
    dependencies {
        // Forge 1.12.2 build 2860 is published as UserDev 3.
        // ForgeGradle 3+ understands UserDev 3; ForgeGradle 2.3 does not.
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.0.0'
group = 'com.syhung2k7.dregoravillagespawn'
archivesBaseName = 'DregoraVillageSpawn'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    // Run configurations are not needed for the CI build.
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
}
